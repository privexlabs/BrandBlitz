name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

# Least privilege by default: every job in this workflow only reads the repo.
# The build job consumes Sentry secrets but never writes back to GitHub, so no
# job needs a broader scope — add job-level permissions if that ever changes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Markdown lint ────────────────────────────────────────────────────────────
  docs-lint:
    name: Markdown lint (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint all Markdown files
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore '.corepack/**' \
            --config .markdownlint.json \
            || true   # report findings but don't fail until rule-set is stable
          markdownlint 'docs/runbooks/*.md' --ignore node_modules --config .markdownlint.json
        # The second call enforces runbooks strictly because they are the
        # critical operational documents (rotate-secrets.md, cdn-purge.md, …)

  # ── Environment config validation ───────────────────────────────────────────
  env-check:
    name: Required env vars present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate ALLOWED_ORIGINS is configured everywhere
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1"
            if grep -Eq '^[[:space:]]*ALLOWED_ORIGINS[:=]' "$file"; then
              echo "✅ $file declares ALLOWED_ORIGINS"
            else
              echo "❌ $file is missing ALLOWED_ORIGINS"
              fail=1
            fi
          }
          # ALLOWED_ORIGINS must be present in every environment's config so the
          # API never falls back to a permissive CORS origin (no wildcard).
          check .env.example
          check apps/api/.env.test
          check docker-compose.yml
          if [ "$fail" -ne 0 ]; then
            echo "::error::ALLOWED_ORIGINS must be set in every environment config (no wildcard fallback)."
            exit 1
          fi

  # ── Node version consistency (issue #897) ───────────────────────────────────
  # The Node version is pinned once in .nvmrc and must match the base image
  # used by every Dockerfile so the three services cannot drift apart again.
  dockerfile-node-version:
    name: Node version matches .nvmrc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Dockerfiles pin the .nvmrc Node version
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          echo "Expected Node version from .nvmrc: ${expected}"

          failed=0
          for dockerfile in \
            apps/api/Dockerfile \
            apps/web/Dockerfile \
            apps/deposit-monitor/Dockerfile; do
            matches="$(grep -E '^FROM node:' "$dockerfile" || true)"
            if [ -z "$matches" ]; then
              echo "::error file=${dockerfile}::no Node base image (FROM node:...) found"
              failed=1
              continue
            fi
            while IFS= read -r from_line; do
              image="${from_line#FROM }"
              image="${image%% AS *}"
              version="$(printf '%s' "$image" | sed -E 's/^node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/')"
              if [ "$version" = "$image" ]; then
                echo "::error file=${dockerfile}::Node base image must be pinned as node:<version>-alpine@sha256:<digest>, got: ${image}"
                failed=1
              elif [ "$version" != "$expected" ]; then
                echo "::error file=${dockerfile}::expected node:${expected}-alpine, found node:${version}-alpine"
                failed=1
              else
                echo "✅ ${dockerfile}: ${image}"
              fi
            done <<< "$matches"
          done

          exit "$failed"

  # ── Validate .env.example vs config schema ──────────────────────────────────
  validate-env-example:
    name: Validate .env.example vs config schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm/action-setup v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/pnpm/action-setup.git refs/tags/v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      # actions/setup-node v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/setup-node.git refs/tags/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate .env.example against config schema
        run: pnpm validate-env-example

  # ── Migration filename + duplicate-prefix lint (#951) ──────────────────────
  migrations-lint:
    name: Migration filenames and prefixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint migration filenames
        run: pnpm --filter @brandblitz/api migrate:lint

  # ── Unit tests ───────────────────────────────────────────────────────────────
  test-api:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brandblitz
          POSTGRES_PASSWORD: brandblitz_dev
          POSTGRES_DB: brandblitz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Seed test database
        run: psql -h localhost -U brandblitz -d brandblitz_test -f init.sql
        env:
          PGPASSWORD: brandblitz_dev
      - run: pnpm --filter @brandblitz/api test

  test-web:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brandblitz/web test

  test-storage:
    name: Storage package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brandblitz/storage test

  # ── Benchmark stellar package ───────────────────────────────────────────────
  bench-stellar:
    name: Stellar muxed account benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run muxed account slug generation benchmark
        run: pnpm --filter @brandblitz/stellar bench
      - name: Log benchmark results (informational only - no hard budget failure)
        run: echo "Benchmark completed. Review ops/sec in logs above."

  # ── Build + source-map upload (Sentry) ──────────────────────────────────────
  build:
    name: Build & upload source maps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-api, test-web, test-storage, bench-stellar]
    # Only upload maps on pushes to main (not PRs — avoids noise & token exposure)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_API: ${{ secrets.SENTRY_PROJECT_API }}
      SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build API (generates dist/ with source maps)
        working-directory: apps/api
        run: pnpm build

      - name: Build Web (Next.js — generates .next/ with source maps)
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Upload API source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases new "${{ github.sha }}"
          npx @sentry/cli releases files "${{ github.sha }}" upload-sourcemaps \
            apps/api/dist \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_API" \
            --rewrite
          npx @sentry/cli releases finalize "${{ github.sha }}"

      - name: Upload Web source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases files "${{ github.sha }}" upload-sourcemaps \
            apps/web/.next \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_WEB" \
            --rewrite
