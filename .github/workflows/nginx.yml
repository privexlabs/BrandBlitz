name: nginx image

on:
  pull_request:
    paths:
      - "nginx/**"
      - ".github/workflows/nginx.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "nginx/**"
      - ".github/workflows/nginx.yml"

# Building the image only needs read access to the repository.
permissions:
  contents: read

concurrency:
  group: nginx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nginx image
    runs-on: ubuntu-latest
    # Covers checkout, buildx setup, base image pull, nginx + ngx_brotli compile.
    timeout-minutes: 20
    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # docker/setup-buildx-action v3 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/docker/setup-buildx-action.git refs/tags/v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Rebuilding verifies that the pinned base-image digest still resolves and
      # that ngx_brotli still compiles against it (issue #898).
      # docker/build-push-action v6 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/docker/build-push-action.git refs/tags/v6
      - name: Build nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginx
          file: nginx/Dockerfile
          push: false
          load: true
          tags: brandblitz-nginx:ci

      - name: Verify brotli modules were built
        run: |
          docker run --rm --entrypoint sh brandblitz-nginx:ci -c \
            'test -f /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so && test -f /usr/lib/nginx/modules/ngx_http_brotli_static_module.so'
