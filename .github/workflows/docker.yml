name: Docker publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: privexlabs
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://brandblitz.app/api' }}
  NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://brandblitz.app' }}
  NEXT_PUBLIC_CDN_HOST: ${{ vars.NEXT_PUBLIC_CDN_HOST || 'assets.brandblitz.app' }}

jobs:
  build-push:
    name: Build & push ${{ matrix.app }} image
    runs-on: ubuntu-latest
    # Timeout covers: checkout + buildx setup + login + metadata + local build +
    # Trivy scan + push + cosign sign for one matrix entry.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign OIDC keyless signing
      security-events: write # required to upload SARIF results to Security tab

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, deposit-monitor]

    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3 — pinned to commit SHA
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        # docker/login-action v3 — pinned to commit SHA
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        # docker/metadata-action v5 — pinned to commit SHA
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BrandBlitz ${{ matrix.app }}
            org.opencontainers.image.description=BrandBlitz ${{ matrix.app }} service
            org.opencontainers.image.vendor=privexlabs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build local image ${{ matrix.app }}
        # docker/build-push-action v6 — pinned to commit SHA
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: brandblitz-${{ matrix.app }}:local
          # Keep public build args aligned with apps/web/Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}
            NEXT_PUBLIC_CDN_HOST=${{ env.NEXT_PUBLIC_CDN_HOST }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}:buildcache,mode=max

      - name: Verify web API URL is baked into client bundle
        if: matrix.app == 'web'
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          docker run --rm \
            -e "EXPECTED_API_URL=$NEXT_PUBLIC_API_URL" \
            --entrypoint sh brandblitz-web:local \
            -c 'grep -R -l -F -- "$EXPECTED_API_URL" /app/apps/web/.next/static'

      # To run the Trivy scan locally:
      #   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image brandblitz-${{ matrix.app }}:local
      - name: Run Trivy vulnerability scanner
        id: trivy
        # aquasecurity/trivy-action — pinned to commit SHA instead of the
        # mutable @master branch.  To upgrade:
        #   git ls-remote https://github.com/aquasecurity/trivy-action.git refs/heads/master
        # then replace the SHA below.
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master as of 2026-10-17
        with:
          image-ref: brandblitz-${{ matrix.app }}:local
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results to GitHub Security tab
        # github/codeql-action/upload-sarif v3 — pinned to commit SHA
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        if: always() && (steps.trivy.outcome == 'success' || steps.trivy.outcome == 'failure')
        with:
          sarif_file: "trivy-results.sarif"
          category: brandblitz-${{ matrix.app }}

      - name: Build and push ${{ matrix.app }}
        id: push
        # docker/build-push-action v6 — pinned to commit SHA (same as above)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep public build args aligned with apps/web/Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}
            NEXT_PUBLIC_CDN_HOST=${{ env.NEXT_PUBLIC_CDN_HOST }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        # sigstore/cosign-installer v3 — pinned to commit SHA
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.ORG }}/brandblitz-${{ matrix.app }}@${{ steps.push.outputs.digest }}"
