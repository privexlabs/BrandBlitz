name: E2E Tests

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "e2e/**"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - ".github/workflows/e2e.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "e2e/**"

# Cancel any in-progress run for the same branch/PR so rapid pushes don't
# queue up redundant Playwright runs (each of which spins up a full Postgres
# service container and installs browser binaries).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions/checkout v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3 — pinned to commit SHA
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start docker-compose services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

          # Wait for services to be healthy
          echo "Waiting for services to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "✓ API is healthy"
              break
            fi
            echo "  Attempt $i/60: API not ready yet..."
            sleep 2
          done
        env:
          SEED_DEV: "1"

      # pnpm/action-setup v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/pnpm/action-setup.git refs/tags/v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      # actions/setup-node v4 — pinned to commit SHA
      # To upgrade: git ls-remote https://github.com/actions/setup-node.git refs/tags/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload trace artifacts on failure
        # actions/upload-artifact v4 — pinned to commit SHA
        # To upgrade: git ls-remote https://github.com/actions/upload-artifact.git refs/tags/v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/artifacts/
          retention-days: 30

      - name: Stop docker-compose services
        if: always()
        run: docker compose down -v
